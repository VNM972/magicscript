name: Magic Script V2 checks

on:
  push:
    branches:
      - free-api-ci-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Free API preflight
        continue-on-error: true
        run: npm run check:free-api

      - name: Typecheck, tests and Control Center build
        run: npm run check

      - name: Initialize local D1
        run: npm run d1:local:init

      - name: Worker + D1 structured discovery smoke
        run: |
          npm run dev:api:local > /tmp/magicscript-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8787/health > /dev/null; then
              break
            fi

            if [ "$i" -eq 40 ]; then
              cat /tmp/magicscript-api.log
              exit 1
            fi

            sleep 0.5
          done

          npm run smoke:worker
