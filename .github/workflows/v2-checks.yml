name: Magic Script V2 checks

on:
  push:
    branches:
      - ci-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Free API preflight
        continue-on-error: true
        run: npm run check:free-api

      - name: Typecheck, tests and Control Center build
        run: npm run check
